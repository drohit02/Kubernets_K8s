apiVersion: v1
kind: ReplicationController
metadata: 
  name: firs-replication-controller
spec: 
  replicas: 3
  selector: 
    app: ngnix-web
  template: 
    metadata:
      labels:
        app: ngnix-web
    spec: 
      containers: 
        - name: nginx
          image: nginx:1.25


#spec selector.app ----> should be same as --->template metadata.labels.app which lets link pod which are controller define by the template spec