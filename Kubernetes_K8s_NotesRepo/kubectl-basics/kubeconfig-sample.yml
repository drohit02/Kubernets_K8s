## kubectl communicates with the cluster using this config file.
## Default location: ~/.kube/config
## Override with: --kubeconfig flag or KUBECONFIG env variable

apiVersion: v1              # always v1 for kubeconfig
kind: Config                # not a cluster object — only kubectl reads this

# ── CLUSTERS ─────────────────────────────────────────────────────────────────
# List of cluster API server addresses and their CA certs
clusters:
  - name: dev-cluster       # name used to reference this cluster in contexts
    cluster:
      server: https://192.168.1.100:6443   # API server address
      certificate-authority-data: <base64-encoded-CA-cert>  # trust anchor

  - name: prod-cluster
    cluster:
      server: https://prod.k8s.company.com:6443
      certificate-authority-data: <base64-encoded-CA-cert>

# ── USERS ─────────────────────────────────────────────────────────────────────
# Credentials kubectl uses to authenticate to the API server
users:
  - name: dev-admin         # name used to reference this user in contexts
    user:
      client-certificate-data: <base64-encoded-cert>   # mTLS client cert
      client-key-data: <base64-encoded-key>            # mTLS client key

  - name: prod-readonly
    user:
      token: <service-account-bearer-token>            # SA token auth

# ── CONTEXTS ──────────────────────────────────────────────────────────────────
# A context = one cluster + one user + one namespace
# Switch contexts to switch between clusters/users
contexts:
  - name: dev-context       # the name you use with kubectl config use-context
    context:
      cluster: dev-cluster  # references clusters[].name above
      user: dev-admin       # references users[].name above
      namespace: default    # commands default to this namespace in this context

  - name: prod-context
    context:
      cluster: prod-cluster
      user: prod-readonly
      namespace: production

# ── CURRENT CONTEXT ───────────────────────────────────────────────────────────
# This is the active context — all kubectl commands use this unless overridden
current-context: dev-context  # switch with: kubectl config use-context <name>
